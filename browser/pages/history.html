<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>History</title><link rel="stylesheet" href="shared.css"></head>
<body><main>
<h1>History</h1>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search history">

</div>
<div id="list"></div>
