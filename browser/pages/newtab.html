<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>New Tab</title><link rel="stylesheet" href="shared.css">
<style>
main { max-width: 720px; text-align: center; padding-top: 12vh; }
.logo { font-size: 34px; font-weight: 700; letter-spacing: -1px; margin-bottom: 20px; }
.logo span { color: var(--accent); }
form { display: flex; gap: 8px; margin-bottom: 36px; }
form input { flex: 1; font-size: 16px; padding: 12px 18px; border-radius: 24px; }
form button { border-radius: 24px; padding: 0 20px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: inherit; text-decoration: none !important; overflow: hidden; }
.tile:hover { background: var(--hover); }
.tile .fav { width: 32px; height: 32px; font-size: 16px; border-radius: 8px; }
.tile .t { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.links { margin-top: 36px; display: flex; gap: 18px; justify-content: center; font-size: 13px; }
</style></head>
<body><main>
<div class="logo">Drew's <span>Browser</span></div>
<form id="search"><input id="q" type="search" placeholder="Search the web or type a URL" autofocus autocomplete="off"><button type="submit">Go</button></form>
<h2 id="top-title" class="muted" hidden>Frequently visited</h2>
<div class="grid" id="top"></div>
<h2 id="bm-title" class="muted" hidden>Bookmarks</h2>
<div class="grid" id="bm"></div>
<div class="links"><a href="drew://bookmarks">Bookmarks</a><a href="drew://history">History</a><a href="drew://downloads">Downloads</a><a href="drew://settings">Settings</a></div>
</main>
<script src="shared.js"></script><script src="newtab.js"></script></body></html>
