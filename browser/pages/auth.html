<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="shared.css">
<style>main{max-width:none;padding:18px 22px} label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)} input{width:100%} .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}</style></head>
<body><main>
<h1 id="title" style="font-size:17px;margin-bottom:4px">Sign in</h1>
<p id="msg" class="muted" style="margin:0 0 6px;font-size:13px"></p>
<form id="f">
  <label for="u">Username</label><input id="u" type="text" autocomplete="username" autofocus>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <div class="acts"><button type="button" id="cancel">Cancel</button><button type="submit">Sign in</button></div>
</form>
</main><script src="shared.js"></script><script src="auth.js"></script></body></html>
